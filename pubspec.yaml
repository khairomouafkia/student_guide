name: student_guide
description: Student Guide - university services (mobile + web admin)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2          # profile photo (resizes + compresses before upload)
  local_auth: ^2.3.0            # optional biometric unlock
  firebase_core: ^3.6.0         # push notifications (enabled with --dart-define=ENABLE_PUSH=true)
  firebase_messaging: ^15.1.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  supabase: ^2.3.0   # Dart-only client, used for Realtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
